<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.big{font-size:3.2em;text-align:center;animation:fl 3s infinite}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,var(--org),var(--pur));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;flex-wrap:wrap}

.q{font-weight:700}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{min-height:120px;border:4px dashed var(--pur);border-radius:18px;padding:8px;text-align:center}
.drag{display:inline-block;margin:4px;padding:8px 12px;border-radius:14px;background:var(--soft);touch-action:none;cursor:grab;user-select:none}
.ghost{position:fixed;z-index:99;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#wheel{width:230px;height:230px;border-radius:50%;margin:14px auto;position:relative;transition:transform 2s cubic-bezier(.2,.8,.2,1);background:conic-gradient(#f4b942 0 60deg,#e0449b 0 120deg,#3f9b57 0 180deg,#4a90d9 0 240deg,#7b3fa0 0 300deg,#e8643c 0 360deg);border:6px solid var(--ink)}
#wheel span{position:absolute;left:50%;top:50%;font-size:1.8em;margin:-16px;transform-origin:50% 50%}
.ptr{text-align:center;font-size:2em;margin-bottom:-26px}
.fcard{min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center}
.mem{font-size:2.2em;min-height:76px}
.badge{text-align:center;padding:10px;border-radius:18px;background:var(--soft)}.badge.off{filter:grayscale(1);opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:20px;opacity:0;transition:.3s;z-index:60;text-align:center;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--grn);color:#fff}
.cf{position:fixed;z-index:70;font-size:1.6em;pointer-events:none;animation:fly 1.2s forwards}
#laser{position:fixed;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(#fff 10%,#f00 45%,rgba(255,0,0,.2) 75%);box-shadow:0 0 20px 8px rgba(255,0,0,.6);pointer-events:none;z-index:80;display:none}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
small{opacity:.85}
</style>
</head>
